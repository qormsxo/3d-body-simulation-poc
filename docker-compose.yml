version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: doodll-poc-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-doodll_pass}
      MYSQL_DATABASE: ${DB_DATABASE:-doodll_poc}
      MYSQL_USER: ${DB_USERNAME:-doodll}
      MYSQL_PASSWORD: ${DB_PASSWORD:-doodll_pass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${DB_PASSWORD:-doodll_pass}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: doodll-poc-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
